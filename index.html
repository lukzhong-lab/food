<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>饗宴矩陣 - 旗艦優化版</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --dark: #0a0a0a;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(212, 175, 55, 0.3);
        }

        body {
            margin: 0; background: var(--dark); color: #e0e0e0;
            font-family: 'Noto Sans TC', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
        }

        /* 頂部中控台 - 固定位置提升操作感 */
        .control-panel {
            width: 100%; max-width: 500px;
            background: linear-gradient(180deg, #111 0%, transparent 100%);
            padding: 20px 0; position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
        }

        .display-screen {
            width: 90%; margin: 0 auto; height: 100px;
            background: #000; border: 1px solid var(--gold); border-radius: 12px;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
        }

        #rolling-text {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.8rem; font-weight: bold; color: var(--gold);
            text-shadow: 0 0 10px var(--gold); text-align: center;
        }

        .input-bar {
            width: 90%; margin: 15px auto 0; display: flex; gap: 8px;
        }

        input[type="text"] {
            flex: 1; background: rgba(0,0,0,0.6); border: 1px solid #333;
            color: #fff; padding: 12px; border-radius: 8px; outline: none; transition: 0.3s;
        }

        input:focus { border-color: var(--gold); box-shadow: 0 0 10px rgba(212,175,55,0.2); }

        .exe-btn {
            background: var(--gold); border: none; padding: 0 15px;
            border-radius: 8px; font-weight: 900; cursor: pointer; color: #000;
        }

        /* 網格美化 */
        .matrix-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
            width: 92%; max-width: 500px; padding: 25px 0 180px;
        }

        .matrix-card {
            background: var(--glass); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px; padding: 22px 10px; text-align: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative; overflow: hidden;
        }

        .matrix-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: var(--accent); opacity: 0.8;
        }

        .matrix-card:active { transform: scale(0.92); background: rgba(255,255,255,0.1); }

        .m-emoji { font-size: 2.2rem; display: block; margin-bottom: 8px; }
        .m-title { font-weight: 900; font-size: 0.9rem; letter-spacing: 1px; }

        /* 分類色彩協議 */
        .brk { --accent: #00ff88; } .bento { --accent: #ff9f43; }
        .jp { --accent: #3498db; } .drink { --accent: #00d2ff; }
        .sweet { --accent: #ff9a9e; } .st { --accent: #f1c40f; }
        .tw { --accent: #e67e22; } .ff { --accent: #ff4757; }
        .kr { --accent: #a29bfe; } .sea { --accent: #1abc9c; }

        /* 結果彈窗 */
        .modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            z-index: 1000; flex-direction: column; justify-content: center; align-items: center;
            backdrop-filter: blur(15px);
        }

        .modal-content {
            width: 85%; max-width: 380px; text-align: center;
            border: 1px solid var(--gold); padding: 40px 20px; border-radius: 30px;
            background: #000; position: relative;
        }

        .modal-content::after {
            content: ''; position: absolute; inset: -1px; border-radius: 30px;
            background: linear-gradient(45deg, var(--gold), transparent, var(--gold));
            z-index: -1; opacity: 0.3;
        }

        .res-name { font-size: 2.8rem; font-weight: 900; margin: 25px 0; color: #fff; text-shadow: 0 0 20px var(--gold); }

        .action-btn {
            background: linear-gradient(135deg, var(--gold) 0%, #f2d06b 100%);
            color: #000; text-decoration: none; padding: 18px; border-radius: 50px;
            font-weight: 900; display: block; margin-bottom: 12px; transition: 0.2s;
        }

        .sub-btn {
            color: var(--gold); text-decoration: none; padding: 12px;
            border: 1px solid var(--gold); border-radius: 50px; display: block; font-size: 0.85rem;
        }

        .footer-action {
            position: fixed; bottom: 0; width: 100%; padding: 30px 0;
            background: linear-gradient(0deg, #000 70%, transparent);
            display: flex; justify-content: center; z-index: 200;
        }

        .mega-btn {
            background: linear-gradient(135deg, var(--gold) 0%, #f2d06b 100%);
            color: #000; border: none; padding: 18px 80px; font-size: 1.2rem;
            font-weight: 900; border-radius: 50px; cursor: pointer;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
        }

        .rolling { animation: flash 0.15s infinite; }
        @keyframes flash { 50% { opacity: 0.3; } }
    </style>
</head>
<body>

<div class="control-panel">
    <div class="display-screen">
        <div id="rolling-text">READY_TO_SCAN</div>
    </div>
    <div class="input-bar">
        <input type="text" id="custom-in" placeholder="搜尋特定關鍵字 (如: 火鍋)...">
        <button class="exe-btn" id="btn-exe">GO</button>
    </div>
</div>

<div class="matrix-grid" id="grid"></div>

<div class="footer-action">
    <button class="mega-btn" id="btn-all">隨機啟動</button>
</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <div style="color:var(--gold); letter-spacing:5px; font-size:0.7rem;">[ 掃描結果 ]</div>
        <div class="res-name" id="res-name">---</div>
        <a id="lnk-map" class="action-btn" target="_blank">📍 尋找店家</a>
        <a id="lnk-blog" class="sub-btn" target="_blank">📜 食記參考</a>
        <div id="btn-close" style="color:#555; margin-top:25px; cursor:pointer; font-size:0.8rem;">[ 關閉 ]</div>
    </div>
</div>

<script>
    // 資料庫完整保留 (350+ 品項)
    const db = [
        { cat: "晨曦早點", icon: "☀️", style: "brk", items: ["起司蛋餅", "厚培根漢堡", "豬肉滿福堡", "大冰奶", "傳統飯糰", "燒餅夾蛋", "鹹豆漿套餐", "法式吐司", "班尼迪克蛋", "經典美式早午餐", "卡拉雞腿堡", "煎餃/小籠包", "蘿蔔糕加蛋", "鐵板麵套餐", "薯餅塔", "鮪魚蛋吐司", "早午餐拼盤", "花生厚片", "歐姆蛋捲"] },
        { cat: "職人便當", icon: "🍱", style: "bento", items: ["經典炸雞腿便當", "滷排骨便當", "台式炸排骨便當", "控肉便當", "池上木盒便當", "港式燒臘三寶飯", "鯖魚定食", "日式唐揚雞便當", "舒肥雞胸健身餐", "低卡蔬食餐", "厚切豬排便當", "紅燒牛腩飯", "古早味雞肉飯", "烤雞腿便當", "招牌控肉飯"] },
        { cat: "日式職人", icon: "🍣", style: "jp", items: ["生魚片盛合", "迴轉壽司(壽司郎/藏壽司)", "板前握壽司", "鮭魚卵海鮮丼", "豚骨拉麵", "沾麵", "炸豬排定食", "讚岐烏龍麵", "日式咖哩", "天婦羅盛合", "串燒居酒屋", "壽喜燒", "和牛燒肉", "鰻魚飯", "蕎麥麵", "茶碗蒸", "厚蛋燒", "鯛魚燒", "章魚小丸子"] },
        { cat: "究極飲品", icon: "🧋", style: "drink", items: ["珍珠奶茶", "楊枝甘露", "芝芝莓莓", "黑糖珍珠鮮奶", "水果茶", "翡翠檸檬", "波霸奶茶", "拿鐵咖啡", "西西里咖啡", "冰淇淋紅茶", "多多綠茶", "燕麥拿鐵", "泰式奶茶", "仙草凍奶茶", "甘蔗青茶", "抹茶拿鐵", "葡萄柚綠茶", "巧克力可可"] },
        { cat: "微醺甜點", icon: "🍰", style: "sweet", items: ["法式舒芙蕾", "提拉米蘇", "草莓千層蛋糕", "肉桂捲", "焦糖布丁", "巴斯克乳酪", "法式檸檬塔", "熔岩巧克力", "蒙布朗栗子塔", "美式軟餅乾", "馬卡龍盛合", "可麗露", "司康與凝脂奶油", "水果戚風蛋糕", "比利時鬆餅", "紅豆餅(車輪餅)", "白糖粿", "燒麻糬"] },
        { cat: "街邊小吃", icon: "🍢", style: "st", items: ["地瓜球", "大腸包小腸", "蚵仔煎", "大腸麵線", "臭豆腐", "肉圓", "割包", "豬血糕", "甜不辣", "鹽水雞", "滷味攤", "蔥油餅", "胡椒餅", "雞排", "鹹酥雞", "麻辣燙", "東山鴨頭", "烤玉米", "水煎包", "潤餅"] },
        { cat: "台式熱炒", icon: "🔥", style: "tw", items: ["客家小炒", "鳳梨蝦球", "薑絲大腸", "蔥爆牛肉", "糖醋排骨", "三杯雞", "五更腸旺", "宮保雞丁", "蒜泥白肉", "鐵板豆腐", "蚵仔酥", "炒海瓜子", "九層塔烘蛋", "金沙苦瓜", "蒼蠅頭", "鐵板牛柳", "蛤蜊絲瓜"] },
        { cat: "連鎖快餐", icon: "🍟", style: "ff", items: ["麥當勞", "肯德基", "漢堡王", "摩斯漢堡", "Subway", "必勝客", "拿坡里炸雞", "胖老爹", "起家雞", "Nene Chicken", "丹丹漢堡", "壽司郎", "藏壽司", "爭鮮", "吉野家", "すき家"] },
        { cat: "泰印南洋", icon: "🏝️", style: "sea", items: ["月亮蝦餅", "打拋豬", "泰式檸檬魚", "酸辣蝦湯", "綠咖哩雞", "泰式炒河粉", "涼拌青木瓜", "海南雞飯", "越式河粉", "肉骨茶", "叻沙麵", "咖椰吐司"] },
        { cat: "韓式港式", icon: "🍜", style: "kr", items: ["韓式炸雞", "石鍋拌飯", "韓式烤肉", "部隊鍋", "辣炒年糕", "海鮮煎餅", "蝦餃燒賣", "干炒牛河", "港式菠蘿油", "腸粉", "燒臘飯", "西多士"] }
    ];

    const all = db.flatMap(d => d.items);
    const screen = document.getElementById('rolling-text');
    const grid = document.getElementById('grid');

    // 初始化網格
    db.forEach(obj => {
        const div = document.createElement('div');
        div.className = `matrix-card ${obj.style}`;
        div.innerHTML = `<span class="m-emoji">${obj.icon}</span><div class="m-title">${obj.cat}</div>`;
        div.onclick = () => startRoll(obj.items);
        grid.appendChild(div);
    });

    document.getElementById('btn-all').onclick = () => startRoll(all);
    document.getElementById('btn-exe').onclick = () => {
        const val = document.getElementById('custom-in').value.trim();
        if(val) startRoll([val, "Scanning...", val], val);
    };

    function startRoll(arr, forced = null) {
        if(screen.classList.contains('rolling')) return;
        screen.classList.add('rolling');
        
        let count = 0;
        const timer = setInterval(() => {
            screen.innerText = arr[Math.floor(Math.random() * arr.length)];
            count++;
            if(count > 20) {
                clearInterval(timer);
                const final = forced || arr[Math.floor(Math.random() * arr.length)];
                screen.innerText = final;
                screen.classList.remove('rolling');
                showModal(final);
            }
        }, 60);
    }

    function showModal(res) {
        setTimeout(() => {
            document.getElementById('modal').style.display = 'flex';
            document.getElementById('res-name').innerText = res;
            document.getElementById('lnk-map').href = `https://www.google.com/maps/search/${encodeURIComponent(res)}`;
            document.getElementById('lnk-blog').href = `https://www.google.com/search?q=${encodeURIComponent(res + " 推薦食記")}`;
        }, 500);
    }

    document.getElementById('btn-close').onclick = () => {
        document.getElementById('modal').style.display = 'none';
        screen.innerText = 'READY_TO_SCAN';
    };
</script>
</body>
</html>
