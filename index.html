<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>饗宴指令 - 真實影像版</title>
    <style>
        :root {
            --neon-gold: #d4af37;
            --deep-gold: #8a6d3b;
            --cyber-black: #050505;
            --overlay-bg: rgba(0, 0, 0, 0.98);
        }

        body {
            margin: 0; background: var(--cyber-black); color: #e0e0e0;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; overflow-x: hidden;
        }

        header { margin: 30px 0 15px; text-align: center; }
        header h1 { font-size: 1.1rem; letter-spacing: 10px; color: var(--neon-gold); margin: 0; }
        
        /* 模式切換 */
        .mode-nav { display: flex; gap: 8px; margin-bottom: 25px; }
        .mode-btn {
            background: none; border: 1px solid #333; color: #666; padding: 8px 18px;
            border-radius: 2px; cursor: pointer; font-size: 0.8rem;
        }
        .mode-btn.active { border-color: var(--neon-gold); color: var(--neon-gold); }

        /* 數位時鐘區 */
        .clock-box {
            width: 310px; height: 160px; background: #000; border: 1px solid #222;
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .digit {
            width: 70px; height: 100px; background: #080808; border: 1px solid var(--deep-gold);
            font-size: 4rem; line-height: 100px; text-align: center; color: var(--neon-gold);
            font-family: monospace;
        }

        /* 手動網格 */
        .manual-grid {
            display: none; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 92%; max-width: 420px;
        }
        .food-card {
            background: #111; border: 1px solid #222; padding: 18px 2px; text-align: center; cursor: pointer;
        }
        .food-card span.label { font-size: 0.8rem; color: var(--neon-gold); }

        /* --- 結果彈窗：顯示真實美食圖片 --- */
        .overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--overlay-bg); z-index: 1000; flex-direction: column;
            justify-content: center; align-items: center; backdrop-filter: blur(15px);
        }

        .res-container { 
            width: 88%; max-width: 380px; text-align: center;
            border: 1px solid rgba(212, 175, 55, 0.4);
            background: linear-gradient(180deg, #151515 0%, #050505 100%);
            padding: 25px 15px; box-shadow: 0 0 50px rgba(0,0,0,1);
            position: relative;
        }

        /* 食物圖片框架 */
        .food-img-frame {
            width: 100%; height: 220px; background: #000;
            margin: 15px 0; border: 1px solid #333;
            overflow: hidden; position: relative;
        }
        .food-img-frame img {
            width: 100%; height: 100%; object-fit: cover;
            display: none; /* 初始隱藏，讀取完才顯示 */
        }
        .img-loader {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 0.75rem; color: var(--neon-gold); letter-spacing: 2px;
        }

        .res-cat-tag { color: var(--neon-gold); font-size: 0.7rem; letter-spacing: 4px; margin-bottom: 5px; }
        .res-food-name { font-size: 2.2rem; font-weight: bold; margin-bottom: 20px; color: #fff; }
        
        .res-btn-group { display: flex; flex-direction: column; gap: 10px; padding: 0 10px; }
        .res-btn {
            text-decoration: none; color: #000; background: var(--neon-gold);
            padding: 16px; font-size: 0.95rem; font-weight: bold; letter-spacing: 2px; text-align: center;
        }
        .res-btn-alt {
            text-decoration: none; color: var(--neon-gold); background: transparent;
            border: 1px solid var(--neon-gold); padding: 14px; font-size: 0.85rem; letter-spacing: 2px; text-align: center;
        }

        .btn-close { margin-top: 35px; color: #555; cursor: pointer; font-size: 0.75rem; letter-spacing: 3px; }

        .footer { margin-top: auto; padding: 40px 0; }
        .exec-btn {
            background: var(--neon-gold); color: #000; border: none;
            padding: 14px 70px; font-size: 0.95rem; font-weight: bold; letter-spacing: 6px; cursor: pointer;
        }
        .rolling { animation: blink 0.1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    </style>
</head>
<body>

    <header><h1>美食指令矩陣</h1></header>

    <div class="mode-nav">
        <button id="nav-auto" class="mode-btn active">數位隨機</button>
        <button id="nav-manual" class="mode-btn">核心分類</button>
    </div>

    <div id="view-auto" class="clock-box">
        <div class="digit" id="d1">0</div>
        <div class="digit" id="d2">0</div>
    </div>

    <div id="view-manual" class="manual-grid"></div>

    <div class="footer">
        <button class="exec-btn" id="btn-run">啟動執行</button>
    </div>

    <div class="overlay" id="overlay">
        <div class="res-container">
            <div class="res-cat-tag" id="res-cat">[ SCANNING... ]</div>
            
            <div class="food-img-frame">
                <div class="img-loader" id="img-status">影像讀取中...</div>
                <img id="food-pic" src="" alt="美食影像">
            </div>

            <div class="res-food-name" id="res-food">---</div>
            
            <div class="res-btn-group">
                <a id="lnk-map" class="res-btn" target="_blank">📍 立即導航</a>
                <a id="lnk-blog" class="res-btn-alt" target="_blank">📜 瀏覽食記</a>
            </div>
        </div>
        <div class="btn-close" id="btn-close">[ CLOSE SCANNER ]</div>
    </div>

<script>
    // 1. 食物資料庫與對應英文關鍵字 (確保搜尋準確)
    const foodData = [
        { cat: "日式料理", items: [
            { name: "拉麵", en: "ramen" },
            { name: "握壽司", en: "sushi" },
            { name: "炸豬排", en: "tonkatsu" },
            { name: "日式咖哩", en: "japanese curry" }
        ]},
        { cat: "美式風格", items: [
            { name: "手打漢堡", en: "burger" },
            { name: "美式炸雞", en: "fried chicken" },
            { name: "披薩", en: "pizza" },
            { name: "炭烤牛排", en: "steak" }
        ]},
        { cat: "韓式經典", items: [
            { name: "韓式炸雞", en: "korean fried chicken" },
            { name: "石鍋拌飯", en: "bibimbap" },
            { name: "辣炒年糕", en: "teokbokki" }
        ]},
        { cat: "在地小吃", items: [
            { name: "蚵仔煎", en: "oyster omelet" },
            { name: "雞排", en: "taiwanese fried chicken" },
            { name: "滷肉飯", en: "braised pork rice" }
        ]}
    ];

    const btnRun = document.getElementById('btn-run');
    const manualGrid = document.getElementById('view-manual');
    const foodPic = document.getElementById('food-pic');
    const imgStatus = document.getElementById('img-status');

    // 初始化手動分類
    foodData.forEach((data) => {
        const card = document.createElement('div');
        card.className = 'food-card';
        card.innerHTML = `<span class="label">${data.cat}</span>`;
        card.onclick = () => {
            const item = data.items[Math.floor(Math.random() * data.items.length)];
            showFinal(data.cat, item);
        };
        manualGrid.appendChild(card);
    });

    // 數位滾輪邏輯
    btnRun.onclick = () => {
        btnRun.disabled = true;
        const d1 = document.getElementById('d1');
        const d2 = document.getElementById('d2');
        d1.classList.add('rolling'); d2.classList.add('rolling');

        let ticks = 0;
        const timer = setInterval(() => {
            d1.innerText = Math.floor(Math.random()*10);
            d2.innerText = Math.floor(Math.random()*10);
            if(++ticks > 15) {
                clearInterval(timer);
                d1.classList.remove('rolling'); d2.classList.remove('rolling');
                const cat = foodData[Math.floor(Math.random() * foodData.length)];
                const item = cat.items[Math.floor(Math.random() * cat.items.length)];
                showFinal(cat.cat, item);
                btnRun.disabled = false;
            }
        }, 60);
    };

    function showFinal(cat, item) {
        document.getElementById('overlay').style.display = 'flex';
        document.getElementById('res-cat').innerText = `[ ${cat} 模式 ]`;
        document.getElementById('res-food').innerText = item.name;
        
        // 圖片處理
        foodPic.style.display = 'none';
        imgStatus.style.display = 'block';
        imgStatus.innerText = "正在擷取影像...";

        // 核心修正：使用英文關鍵字確保搜尋到真實美食照片
        // 加入隨機數避免瀏覽器快取同一張圖片
        const cacheBuster = Math.floor(Math.random() * 1000);
        const photoUrl = `https://loremflickr.com/500/400/${encodeURIComponent(item.en)}?lock=${cacheBuster}`;
        
        foodPic.src = photoUrl;
        
        foodPic.onload = () => {
            imgStatus.style.display = 'none';
            foodPic.style.display = 'block';
        };
        
        foodPic.onerror = () => {
            imgStatus.innerText = "影像讀取失敗";
        };

        document.getElementById('lnk-map').href = "https://www.google.com/maps/search/" + encodeURIComponent(item.name);
        document.getElementById('lnk-blog').href = "https://www.google.com/search?q=" + encodeURIComponent(item.name + " 推薦食記");
    }

    document.getElementById('btn-close').onclick = () => document.getElementById('overlay').style.display = 'none';

    // 導覽切換
    document.getElementById('nav-auto').onclick = function() {
        this.classList.add('active'); document.getElementById('nav-manual').classList.remove('active');
        document.getElementById('view-auto').style.display = 'flex'; manualGrid.style.display = 'none'; btnRun.style.display = 'block';
    };
    document.getElementById('nav-manual').onclick = function() {
        this.classList.add('active'); document.getElementById('nav-auto').classList.remove('active');
        document.getElementById('view-auto').style.display = 'none'; manualGrid.style.display = 'grid'; btnRun.style.display = 'none';
    };
</script>
</body>
</html>
