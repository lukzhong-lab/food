<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>饗宴指令 - 功能全回歸版</title>
    <style>
        :root {
            --neon-gold: #d4af37;
            --cyber-black: #050505;
        }

        body {
            margin: 0; background: var(--cyber-black); color: #e0e0e0;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        header { margin: 30px 0; text-align: center; }
        header h1 { font-size: 1.2rem; letter-spacing: 10px; color: var(--neon-gold); margin: 0; }
        
        .mode-nav { display: flex; gap: 10px; margin-bottom: 25px; }
        .mode-btn {
            background: none; border: 1px solid #333; color: #666; padding: 10px 20px;
            border-radius: 2px; cursor: pointer; font-size: 0.9rem;
        }
        .mode-btn.active { border-color: var(--neon-gold); color: var(--neon-gold); }

        /* 隨機滾輪區 */
        .clock-box {
            width: 310px; height: 160px; background: #000; border: 1px solid #222;
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .digit {
            width: 70px; height: 110px; background: #080808; border: 1px solid var(--neon-gold);
            font-size: 4.5rem; line-height: 110px; text-align: center; color: var(--neon-gold);
            font-family: monospace;
        }

        /* 手動分類網格 - 隨機點選功能 */
        .manual-grid {
            display: none; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 90%; max-width: 400px;
        }
        .category-card {
            background: #111; border: 1px solid #222; padding: 25px 10px; text-align: center; cursor: pointer;
            transition: 0.2s;
        }
        .category-card:active { border-color: var(--neon-gold); background: #1a1a1a; }
        .cat-name { color: var(--neon-gold); font-size: 1rem; font-weight: bold; }
        .cat-desc { color: #555; font-size: 0.7rem; margin-top: 5px; }

        /* 結果彈窗 */
        .overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98); z-index: 1000; flex-direction: column;
            justify-content: center; align-items: center; backdrop-filter: blur(10px);
        }
        .res-container { 
            width: 85%; max-width: 380px; text-align: center;
            border: 1px solid var(--neon-gold); background: #0a0a0a; padding: 40px 20px;
        }
        .res-food-name { font-size: 3rem; font-weight: 900; margin: 30px 0; color: #fff; text-shadow: 0 0 15px var(--neon-gold); }
        
        .btn-group { display: flex; flex-direction: column; gap: 12px; }
        .res-btn {
            text-decoration: none; color: #000; background: var(--neon-gold);
            padding: 16px; font-size: 1rem; font-weight: bold; letter-spacing: 2px; text-align: center;
        }
        .res-btn-alt {
            text-decoration: none; color: var(--neon-gold); background: transparent;
            border: 1px solid var(--neon-gold); padding: 14px; font-size: 0.9rem; text-align: center;
        }

        .btn-close { margin-top: 40px; color: #444; cursor: pointer; font-size: 0.8rem; letter-spacing: 4px; }
        .footer { margin-top: auto; padding: 40px 0; }
        .exec-btn { background: var(--neon-gold); color: #000; border: none; padding: 15px 80px; font-size: 1.1rem; font-weight: bold; letter-spacing: 8px; cursor: pointer; }
        
        .rolling { animation: blink 0.1s infinite; }
        @keyframes blink { 50% { opacity: 0.4; } }
    </style>
</head>
<body>

    <header><h1>饗宴指令系統</h1></header>

    <div class="mode-nav">
        <button id="nav-auto" class="mode-btn active">全域隨機</button>
        <button id="nav-manual" class="mode-btn">分類隨機</button>
    </div>

    <div id="view-auto" class="clock-box">
        <div class="digit" id="d1">0</div>
        <div class="digit" id="d2">0</div>
    </div>

    <div id="view-manual" class="manual-grid"></div>

    <div class="footer">
        <button class="exec-btn" id="btn-run">啟動執行</button>
    </div>

    <div class="overlay" id="overlay">
        <div class="res-container">
            <div id="res-tag" style="color:var(--neon-gold); font-size:0.8rem; letter-spacing:3px;">[ 最終決定 ]</div>
            <div class="res-food-name" id="res-food">---</div>
            
            <div class="btn-group">
                <a id="lnk-map" class="res-btn" target="_blank">📍 搜尋附近店家</a>
                <a id="lnk-blog" class="res-btn-alt" target="_blank">📜 查看專業食記</a>
            </div>
        </div>
        <div class="btn-close" id="btn-close">[ CLOSE ]</div>
    </div>

<script>
    const foodData = [
        { cat: "台式在地", items: ["滷肉飯", "牛肉麵", "排骨飯", "彰化肉圓", "臭豆腐", "蚵仔煎", "雞排", "鹹酥雞"] },
        { cat: "日式料理", items: ["拉麵", "握壽司", "炸豬排定食", "海鮮丼", "烏龍麵", "日式咖哩"] },
        { cat: "韓式美式", items: ["韓式炸雞", "石鍋拌飯", "部隊鍋", "起司漢堡", "炭烤牛排", "披薩"] },
        { cat: "街頭宵夜", items: ["大腸包小腸", "地瓜球", "麻辣燙", "永和豆漿", "清粥小菜", "東山鴨頭"] }
    ];

    const btnRun = document.getElementById('btn-run');
    const viewManual = document.getElementById('view-manual');

    // 生成分類按鈕：點擊分類後「手動隨機」抽取該分類項
    foodData.forEach(data => {
        const card = document.createElement('div');
        card.className = 'category-card';
        card.innerHTML = `
            <div class="cat-name">${data.cat}</div>
            <div class="cat-desc">隨機抽取 ${data.items.length} 項</div>
        `;
        card.onclick = () => {
            const randomItem = data.items[Math.floor(Math.random() * data.items.length)];
            showResult(data.cat, randomItem);
        };
        viewManual.appendChild(card);
    });

    // 全域隨機按鈕
    btnRun.onclick = () => {
        btnRun.disabled = true;
        const d1 = document.getElementById('d1'); const d2 = document.getElementById('d2');
        d1.classList.add('rolling'); d2.classList.add('rolling');
        
        let ticks = 0;
        const timer = setInterval(() => {
            d1.innerText = Math.floor(Math.random()*10);
            d2.innerText = Math.floor(Math.random()*10);
            if(++ticks > 15) {
                clearInterval(timer);
                d1.classList.remove('rolling'); d2.classList.remove('rolling');
                const cat = foodData[Math.floor(Math.random() * foodData.length)];
                const item = cat.items[Math.floor(Math.random() * cat.items.length)];
                showResult(cat.cat, item);
                btnRun.disabled = false;
            }
        }, 60);
    };

    function showResult(cat, name) {
        document.getElementById('overlay').style.display = 'flex';
        document.getElementById('res-tag').innerText = `[ ${cat} 偵測成功 ]`;
        document.getElementById('res-food').innerText = name;
        
        // 恢復功能性連結
        document.getElementById('lnk-map').href = `https://www.google.com/maps/search/${encodeURIComponent(name)}`;
        document.getElementById('lnk-blog').href = `https://www.google.com/search?q=${encodeURIComponent(name + " 推薦食記")}`;
    }

    document.getElementById('btn-close').onclick = () => document.getElementById('overlay').style.display = 'none';

    // 模式切換邏輯
    document.getElementById('nav-auto').onclick = function() {
        this.classList.add('active'); document.getElementById('nav-manual').classList.remove('active');
        document.getElementById('view-auto').style.display = 'flex'; viewManual.style.display = 'none'; btnRun.style.display = 'block';
    };
    document.getElementById('nav-manual').onclick = function() {
        this.classList.add('active'); document.getElementById('nav-auto').classList.remove('active');
        document.getElementById('view-auto').style.display = 'none'; viewManual.style.display = 'grid'; btnRun.style.display = 'none';
    };
</script>
</body>
</html>
