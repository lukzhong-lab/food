<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>饗宴矩陣 - 全能優化版</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --dark: #0a0a0a;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(212, 175, 55, 0.3);
        }

        body {
            margin: 0; background: var(--dark); color: #e0e0e0;
            font-family: 'Noto Sans TC', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            overflow: hidden; height: 100vh;
        }

        /* 頂部中控台 - 縮減高度以相容輸入框 */
        .control-panel {
            width: 100%; max-width: 500px; padding: 10px 0;
            background: linear-gradient(180deg, #111 0%, transparent 100%);
            border-bottom: 1px solid var(--border);
        }

        .display-screen {
            width: 90%; margin: 0 auto; height: 60px;
            background: #000; border: 1px solid var(--gold); border-radius: 12px;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }

        #rolling-text {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.3rem; font-weight: bold; color: var(--gold);
            text-shadow: 0 0 8px var(--gold); text-align: center;
        }

        /* 手動搜尋框回歸 */
        .input-bar {
            width: 90%; margin: 10px auto 0; display: flex; gap: 5px;
        }

        input[type="text"] {
            flex: 1; background: rgba(255,255,255,0.05); border: 1px solid #333;
            color: #fff; padding: 10px 15px; border-radius: 50px; font-size: 0.85rem;
            outline: none; transition: 0.3s;
        }
        input[type="text"]:focus { border-color: var(--gold); background: rgba(255,255,255,0.1); }

        .exe-btn {
            background: var(--gold); border: none; padding: 0 15px;
            border-radius: 50px; font-weight: 900; cursor: pointer; color: #000;
        }

        /* 3x4 網格佈局 */
        .matrix-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr);
            gap: 8px; width: 94%; max-width: 500px; flex-grow: 1; padding: 15px 0 110px;
        }

        .matrix-card {
            background: var(--glass); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px; display: flex; flex-direction: column;
            justify-content: center; align-items: center; transition: 0.2s; position: relative;
        }

        .matrix-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px;
            background: var(--accent); border-radius: 3px 3px 0 0;
        }

        .matrix-card:active { transform: scale(0.92); background: rgba(255,255,255,0.1); }
        .m-emoji { font-size: 1.4rem; margin-bottom: 2px; }
        .m-title { font-weight: 900; font-size: 0.7rem; color: #ccc; }

        /* 分類色彩 */
        .brk { --accent: #00ff88; } .bento { --accent: #ff9f43; } .jp { --accent: #3498db; }
        .kr { --accent: #a29bfe; } .hk { --accent: #1abc9c; } .we { --accent: #ff5e57; }
        .tw { --accent: #e67e22; } .st { --accent: #f1c40f; } .drink { --accent: #00d2ff; }
        .sweet { --accent: #ff9a9e; } .ff { --accent: #ff4757; } .sea { --accent: #27ae60; }

        /* 彈窗樣式 */
        .modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            z-index: 1000; flex-direction: column; justify-content: center; align-items: center;
            backdrop-filter: blur(15px);
        }

        .modal-content {
            width: 82%; max-width: 350px; text-align: center;
            border: 1px solid var(--gold); padding: 30px 20px; border-radius: 25px; background: #000;
        }

        .res-name { font-size: 2.2rem; font-weight: 900; margin: 20px 0; color: #fff; text-shadow: 0 0 15px var(--gold); }

        .action-btn { background: var(--gold); color: #000; text-decoration: none; padding: 15px; border-radius: 50px; font-weight: 900; display: block; margin-bottom: 12px; }
        .sub-btn { color: var(--gold); text-decoration: none; padding: 12px; border: 1px solid var(--gold); border-radius: 50px; display: block; font-size: 0.85rem; font-weight: bold; }

        .footer-action {
            position: fixed; bottom: 0; width: 100%; padding: 25px 0;
            background: linear-gradient(0deg, #000 85%, transparent); display: flex; justify-content: center; z-index: 200;
        }

        .mega-btn { background: linear-gradient(135deg, var(--gold) 0%, #f2d06b 100%); color: #000; border: none; padding: 15px 70px; font-size: 1.1rem; font-weight: 900; border-radius: 50px; cursor: pointer; }
        .rolling { animation: flash 0.15s infinite; }
        @keyframes flash { 50% { opacity: 0.3; } }
    </style>
</head>
<body>

<div class="control-panel">
    <div class="display-screen">
        <div id="rolling-text">READY_TO_SCAN</div>
    </div>
    <div class="input-bar">
        <input type="text" id="custom-in" placeholder="輸入美食關鍵字 (如: 火鍋)...">
        <button class="exe-btn" id="btn-exe">啟動</button>
    </div>
</div>

<div class="matrix-grid" id="grid"></div>

<div class="footer-action">
    <button class="mega-btn" id="btn-all">全域啟動</button>
</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <div style="color:var(--gold); font-size:0.7rem; letter-spacing: 2px;">[ 掃描完成 ]</div>
        <div class="res-name" id="res-name">---</div>
        <a id="lnk-map" class="action-btn" target="_blank">📍 尋找附近店家</a>
        <a id="lnk-blog" class="sub-btn" target="_blank">📜 查看部落客食記</a>
        <div id="btn-close" style="color:#555; margin-top:25px; cursor:pointer; font-size:0.8rem;">[ 返回矩陣 ]</div>
    </div>
</div>

<script>
    const db = [
        { cat: "晨曦早點", icon: "☀️", style: "brk", items: ["蛋餅", "厚培根漢堡", "大冰奶", "燒餅夾蛋", "飯糰", "法式吐司", "早午餐拼盤", "蘿蔔糕"] },
        { cat: "職人便當", icon: "🍱", style: "bento", items: ["雞腿便當", "滷排骨便當", "三寶飯", "木盒便當", "焢肉飯", "健身餐", "鯖魚定食"] },
        { cat: "日式職人", icon: "🍣", style: "jp", items: ["生魚片", "迴轉壽司", "拉麵", "沾麵", "炸豬排", "章魚小丸子", "和牛燒肉", "鰻魚飯"] },
        { cat: "韓式潮流", icon: "🇰🇷", style: "kr", items: ["韓式炸雞", "石鍋拌飯", "韓式烤肉", "部隊鍋", "辣炒年糕", "海鮮煎餅", "炸醬麵"] },
        { cat: "港式茶點", icon: "🥟", style: "hk", items: ["蝦餃燒賣", "干炒牛河", "菠蘿油", "腸粉", "燒臘飯", "西多士", "流沙包"] },
        { cat: "美義風味", icon: "🍕", style: "we", items: ["牛肉漢堡", "牛排", "義大利麵", "披薩", "燉飯", "烤肋排", "炸雞翅"] },
        { cat: "台式熱炒", icon: "🔥", style: "tw", items: ["鳳梨蝦球", "客家小炒", "薑絲大腸", "蔥爆牛肉", "三杯雞", "五更腸旺", "宮保雞丁"] },
        { cat: "街邊小吃", icon: "🍢", style: "st", items: ["地瓜球", "大腸包小腸", "蚵仔煎", "臭豆腐", "肉圓", "雞排", "鹹酥雞", "麻辣燙"] },
        { cat: "究極飲品", icon: "🧋", style: "drink", items: ["珍珠奶茶", "楊枝甘露", "芝芝莓莓", "黑糖鮮奶", "水果茶", "翡翠檸檬", "拿鐵"] },
        { cat: "微醺甜點", icon: "🍰", style: "sweet", items: ["舒芙蕾", "提拉米蘇", "千層蛋糕", "肉桂捲", "焦糖布丁", "巴斯克乳酪", "紅豆餅"] },
        { cat: "連鎖快餐", icon: "🍟", style: "ff", items: ["麥當勞", "肯德基", "漢堡王", "摩斯", "必勝客", "起家雞", "丹丹漢堡"] },
        { cat: "異國風味", icon: "🏝️", style: "sea", items: ["月亮蝦餅", "打拋豬", "檸檬魚", "泰式奶茶", "海南雞飯", "叻沙麵", "肉骨茶"] }
    ];

    const all = db.flatMap(d => d.items);
    const screen = document.getElementById('rolling-text');
    const grid = document.getElementById('grid');

    db.forEach(obj => {
        const div = document.createElement('div');
        div.className = `matrix-card ${obj.style}`;
        div.innerHTML = `<span class="m-emoji">${obj.icon}</span><div class="m-title">${obj.cat}</div>`;
        div.onclick = () => startRoll(obj.items);
        grid.appendChild(div);
    });

    document.getElementById('btn-all').onclick = () => startRoll(all);
    
    // 手動搜尋邏輯執行
    document.getElementById('btn-exe').onclick = () => {
        const val = document.getElementById('custom-in').value.trim();
        if(val) startRoll([val, "Searching...", val], val);
    };

    function startRoll(arr, forced = null) {
        if(screen.classList.contains('rolling')) return;
        screen.classList.add('rolling');
        let count = 0;
        const timer = setInterval(() => {
            screen.innerText = arr[Math.floor(Math.random() * arr.length)];
            count++;
            if(count > 20) {
                clearInterval(timer);
                const final = forced || arr[Math.floor(Math.random() * arr.length)];
                screen.innerText = final;
                screen.classList.remove('rolling');
                showModal(final);
            }
        }, 60);
    }

    function showModal(res) {
        setTimeout(() => {
            document.getElementById('modal').style.display = 'flex';
            document.getElementById('res-name').innerText = res;
            const encoded = encodeURIComponent(res);
            document.getElementById('lnk-map').href = `https://www.google.com/maps/search/${encoded}`;
            document.getElementById('lnk-blog').href = `https://www.google.com/search?q=${encoded}+推薦+食記`;
        }, 500);
    }

    document.getElementById('btn-close').onclick = () => {
        document.getElementById('modal').style.display = 'none';
        screen.innerText = 'READY_TO_SCAN';
        document.getElementById('custom-in').value = ''; // 清空輸入
    };
</script>
</body>
</html>
