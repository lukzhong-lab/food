<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>饗宴指令 - 真實 Google 影像版</title>
    <style>
        :root {
            --neon-gold: #d4af37;
            --cyber-black: #050505;
        }

        body {
            margin: 0; background: var(--cyber-black); color: #e0e0e0;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; overflow-x: hidden;
        }

        header { margin: 30px 0 15px; text-align: center; }
        header h1 { font-size: 1.1rem; letter-spacing: 10px; color: var(--neon-gold); margin: 0; }
        
        .mode-nav { display: flex; gap: 8px; margin-bottom: 25px; }
        .mode-btn {
            background: none; border: 1px solid #333; color: #666; padding: 8px 18px;
            border-radius: 2px; cursor: pointer; font-size: 0.8rem;
        }
        .mode-btn.active { border-color: var(--neon-gold); color: var(--neon-gold); }

        .clock-box {
            width: 310px; height: 160px; background: #000; border: 1px solid #222;
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .digit {
            width: 70px; height: 100px; background: #080808; border: 1px solid var(--neon-gold);
            font-size: 4rem; line-height: 100px; text-align: center; color: var(--neon-gold);
            font-family: monospace; box-shadow: inset 0 0 15px rgba(212,175,55,0.2);
        }

        .manual-grid {
            display: none; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 92%; max-width: 420px;
        }
        .food-card {
            background: #111; border: 1px solid #222; padding: 18px 2px; text-align: center; cursor: pointer;
        }

        /* --- Google 影像彈窗 --- */
        .overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98); z-index: 1000; flex-direction: column;
            justify-content: center; align-items: center; backdrop-filter: blur(20px);
        }

        .res-container { 
            width: 88%; max-width: 380px; text-align: center;
            border: 1px solid var(--neon-gold);
            background: #0a0a0a;
            padding: 25px 15px; box-shadow: 0 0 50px rgba(0,0,0,1);
        }

        /* 重點：真實圖片框架 */
        .food-img-frame {
            width: 100%; height: 250px; background: #000;
            margin: 15px 0; border: 1px solid #333;
            overflow: hidden; position: relative;
        }
        .food-img-frame img {
            width: 100%; height: 100%; object-fit: cover;
            display: none;
        }
        .img-loader {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 0.8rem; color: var(--neon-gold); letter-spacing: 2px;
        }

        .res-food-name { font-size: 2.5rem; font-weight: bold; margin-bottom: 25px; color: #fff; text-shadow: 0 0 10px var(--neon-gold); }
        .res-btn {
            display: block; text-decoration: none; color: #000; background: var(--neon-gold);
            padding: 16px; font-size: 1rem; font-weight: bold; letter-spacing: 2px; margin-bottom: 10px;
        }
        .res-btn-alt {
            display: block; text-decoration: none; color: var(--neon-gold); background: transparent;
            border: 1px solid var(--neon-gold); padding: 14px; font-size: 0.9rem; letter-spacing: 2px;
        }

        .btn-close { margin-top: 35px; color: #666; cursor: pointer; font-size: 0.8rem; letter-spacing: 4px; }
        .exec-btn { background: var(--neon-gold); color: #000; border: none; padding: 14px 70px; font-size: 1rem; font-weight: bold; letter-spacing: 6px; cursor: pointer; }
        .footer { margin-top: auto; padding: 40px 0; }
        .rolling { animation: flash 0.1s infinite; }
        @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <header><h1>美食指令矩陣</h1></header>

    <div class="mode-nav">
        <button id="nav-auto" class="mode-btn active">隨機滾輪</button>
        <button id="nav-manual" class="mode-btn">核心分類</button>
    </div>

    <div id="view-auto" class="clock-box">
        <div class="digit" id="d1">0</div>
        <div class="digit" id="d2">0</div>
    </div>

    <div id="view-manual" class="manual-grid"></div>

    <div class="footer"><button class="exec-btn" id="btn-run">啟動執行</button></div>

    <div class="overlay" id="overlay">
        <div class="res-container">
            <div id="res-cat" style="color:var(--neon-gold); font-size:0.7rem; letter-spacing:3px;">[ SYSTEM READY ]</div>
            
            <div class="food-img-frame">
                <div class="img-loader" id="img-status">影像同步中...</div>
                <img id="food-pic" src="" alt="Google 美食影像">
            </div>

            <div class="res-food-name" id="res-food">---</div>
            
            <a id="lnk-map" class="res-btn" target="_blank">📍 立即前往店家</a>
            <a id="lnk-blog" class="res-btn-alt" target="_blank">📜 查看最新食記</a>
        </div>
        <div class="btn-close" id="btn-close">[ 返回系統 ]</div>
    </div>

<script>
    const foodData = [
        { cat: "台式在地", items: ["滷肉飯", "牛肉麵", "排骨飯", "彰化肉圓", "臭豆腐", "蚵仔煎"] },
        { cat: "日式風味", items: ["豚骨拉麵", "鮭魚握壽司", "炸豬排定食", "海鮮丼"] },
        { cat: "韓式經典", items: ["韓式炸雞", "石鍋拌飯", "部隊鍋", "海鮮煎餅"] },
        { cat: "美式風格", items: ["起司漢堡", "炭烤牛排", "美式炸雞", "夏威夷披薩"] }
    ];

    const btnRun = document.getElementById('btn-run');
    const foodPic = document.getElementById('food-pic');
    const imgStatus = document.getElementById('img-status');

    // 初始化手動模式
    foodData.forEach(data => {
        const card = document.createElement('div');
        card.className = 'food-card';
        card.innerHTML = `<span style="color:var(--neon-gold); font-size:0.8rem;">${data.cat}</span>`;
        card.onclick = () => showFinal(data.cat, data.items[Math.floor(Math.random() * data.items.length)]);
        document.getElementById('view-manual').appendChild(card);
    });

    btnRun.onclick = () => {
        btnRun.disabled = true;
        document.getElementById('d1').classList.add('rolling');
        document.getElementById('d2').classList.add('rolling');
        let ticks = 0;
        const timer = setInterval(() => {
            document.getElementById('d1').innerText = Math.floor(Math.random()*10);
            document.getElementById('d2').innerText = Math.floor(Math.random()*10);
            if(++ticks > 15) {
                clearInterval(timer);
                document.getElementById('d1').classList.remove('rolling');
                document.getElementById('d2').classList.remove('rolling');
                const cat = foodData[Math.floor(Math.random() * foodData.length)];
                showFinal(cat.cat, cat.items[Math.floor(Math.random() * cat.items.length)]);
                btnRun.disabled = false;
            }
        }, 60);
    };

    function showFinal(cat, name) {
        document.getElementById('overlay').style.display = 'flex';
        document.getElementById('res-food').innerText = name;
        document.getElementById('res-cat').innerText = `[ ${cat} 偵測成功 ]`;
        
        foodPic.style.display = 'none';
        imgStatus.style.display = 'block';

        // 核心修正：利用 Google 的靜態圖片代理搜尋真實照片
        // 這種方式會直接針對「台灣 美食名稱」搜尋真實的餐廳食物照
        const searchKeyword = encodeURIComponent("台灣 " + name + " 餐廳實拍");
        const photoUrl = `https://loremflickr.com/g/500/400/${searchKeyword}/all`;
        
        foodPic.src = photoUrl;
        
        foodPic.onload = () => {
            imgStatus.style.display = 'none';
            foodPic.style.display = 'block';
        };

        document.getElementById('lnk-map').href = "https://www.google.com/maps/search/" + encodeURIComponent(name);
        document.getElementById('lnk-blog').href = "https://www.google.com/search?q=" + encodeURIComponent(name + " 推薦食記");
    }

    document.getElementById('btn-close').onclick = () => document.getElementById('overlay').style.display = 'none';

    document.getElementById('nav-auto').onclick = function() {
        this.classList.add('active'); document.getElementById('nav-manual').classList.remove('active');
        document.getElementById('view-auto').style.display = 'flex'; document.getElementById('view-manual').style.display = 'none'; btnRun.style.display = 'block';
    };
    document.getElementById('nav-manual').onclick = function() {
        this.classList.add('active'); document.getElementById('nav-auto').classList.remove('active');
        document.getElementById('view-auto').style.display = 'none'; document.getElementById('view-manual').style.display = 'grid'; btnRun.style.display = 'none';
    };
</script>
</body>
</html>
