<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今天吃什麼</title>

<style>
body{
  font-family: system-ui;
  background:#0f172a;
  color:#e5e7eb;
  margin:0;
  padding:16px;
}
.card{
  max-width:520px;
  margin:auto;
  background:#1e293b;
  padding:18px;
  border-radius:16px;
}
h2{margin-top:0}
select,button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border-radius:12px;
  border:none;
  font-size:16px;
}
button{
  background:#22c55e;
  color:#052e16;
  font-weight:700;
}
.info{
  margin-top:18px;
  line-height:1.7;
}
a{
  color:#38bdf8;
  text-decoration:none;
  display:inline-block;
  margin-top:8px;
}
</style>
</head>

<body>
<div class="card">
  <h2>🍽️ 隨機在地美食</h2>

  <select id="cat">
    <option value="american restaurant">美式</option>
    <option value="chinese restaurant">中式</option>
    <option value="japanese restaurant">日式</option>
    <option value="korean restaurant">韓式</option>
    <option value="thai restaurant">泰式</option>
    <option value="italian restaurant">義式</option>
    <option value="brunch">早午餐</option>
    <option value="hot pot">火鍋</option>
    <option value="bbq">燒肉</option>
    <option value="dessert">甜點</option>
    <option value="street food">小吃</option>
  </select>

  <button onclick="pickFood()">🎲 抽一家</button>

  <div id="out" class="info"></div>
</div>

<script>
const API_URL = "貼上你的 Apps Script /exec 網址";

function pickFood(){
  const out = document.getElementById("out");
  out.innerText = "搜尋中…";

  navigator.geolocation.getCurrentPosition(pos=>{
    const kw = document.getElementById("cat").value;

    fetch(`${API_URL}?lat=${pos.coords.latitude}&lng=${pos.coords.longitude}&keyword=${encodeURIComponent(kw)}`)
      .then(r=>r.json())
      .then(d=>{
        if(d.error){
          out.innerText = d.error;
          return;
        }

        out.innerHTML = `
          <b>${d.name}</b><br>
          ⭐ ${d.rating || "無"}<br>
          📞 ${d.phone || "未提供"}<br>
          🕒 ${d.hours.join("<br>")}<br><br>

          <a href="${d.map}" target="_blank">📍 Google 地圖</a><br>
          <a href="https://www.google.com/search?q=${encodeURIComponent(d.name + ' 食記')}" target="_blank">
            📖 部落客分享
          </a><br>
          <a href="#" onclick="pickFood()">🔄 再抽一家</a>
        `;
      });
  }, ()=>{
    out.innerText = "需要定位權限才能搜尋附近美食";
  });
}
</script>
</body>
</html>
