<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>饗宴指令 - 名稱滾動版</title>
    <style>
        :root {
            --neon-gold: #d4af37;
            --cyber-black: #050505;
        }

        body {
            margin: 0; background: var(--cyber-black); color: #e0e0e0;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        header { margin: 20px 0; text-align: center; }
        header h1 { font-size: 1.1rem; letter-spacing: 8px; color: var(--neon-gold); margin: 0; }
        
        .mode-nav { display: flex; gap: 8px; margin-bottom: 20px; }
        .mode-btn {
            background: none; border: 1px solid #333; color: #666; padding: 8px 15px;
            border-radius: 2px; cursor: pointer; font-size: 0.85rem;
        }
        .mode-btn.active { border-color: var(--neon-gold); color: var(--neon-gold); }

        /* 名稱滾動顯示區 */
        .slot-machine {
            width: 320px; height: 120px; background: #000; border: 1px solid var(--neon-gold);
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 25px; overflow: hidden; position: relative;
            box-shadow: inset 0 0 20px rgba(212,175,55,0.2);
        }
        #rolling-text {
            font-size: 2.2rem; font-weight: bold; color: var(--neon-gold);
            text-shadow: 0 0 10px rgba(212,175,55,0.5);
            letter-spacing: 2px;
        }

        /* 分類網格 */
        .manual-grid {
            display: none; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 95%; max-width: 450px; padding-bottom: 30px;
        }
        .category-card {
            background: #111; border: 1px solid #222; padding: 18px 5px; text-align: center; cursor: pointer;
        }
        .category-card:active { border-color: var(--neon-gold); background: #1a1a1a; }
        .cat-name { color: var(--neon-gold); font-size: 0.9rem; font-weight: bold; }

        /* 結果彈窗 */
        .overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98); z-index: 1000; flex-direction: column;
            justify-content: center; align-items: center; backdrop-filter: blur(10px);
        }
        .res-container { 
            width: 85%; max-width: 360px; text-align: center;
            border: 1px solid var(--neon-gold); background: #0a0a0a; padding: 35px 20px;
        }
        .res-food-name { font-size: 2.8rem; font-weight: 900; margin: 25px 0; color: #fff; text-shadow: 0 0 15px var(--neon-gold); }
        
        .btn-group { display: flex; flex-direction: column; gap: 12px; }
        .res-btn {
            text-decoration: none; color: #000; background: var(--neon-gold);
            padding: 16px; font-size: 1rem; font-weight: bold; text-align: center;
        }
        .res-btn-alt {
            text-decoration: none; color: var(--neon-gold); background: transparent;
            border: 1px solid var(--neon-gold); padding: 14px; font-size: 0.9rem; text-align: center;
        }

        .btn-close { margin-top: 35px; color: #444; cursor: pointer; font-size: 0.8rem; letter-spacing: 4px; }
        .footer { margin-top: auto; padding: 30px 0; }
        .exec-btn { background: var(--neon-gold); color: #000; border: none; padding: 15px 70px; font-size: 1.1rem; font-weight: bold; letter-spacing: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <header><h1>饗宴指令系統</h1></header>

    <div class="mode-nav">
        <button id="nav-auto" class="mode-btn active">全域隨機</button>
        <button id="nav-manual" class="mode-btn">分類隨機</button>
    </div>

    <div id="view-auto" class="slot-machine">
        <div id="rolling-text">READY</div>
    </div>

    <div id="view-manual" class="manual-grid"></div>

    <div class="footer">
        <button class="exec-btn" id="btn-run">啟動執行</button>
    </div>

    <div class="overlay" id="overlay">
        <div class="res-container">
            <div id="res-tag" style="color:var(--neon-gold); font-size:0.8rem; letter-spacing:3px;">[ 指令解碼完成 ]</div>
            <div class="res-food-name" id="res-food">---</div>
            <div class="btn-group">
                <a id="lnk-map" class="res-btn" target="_blank">📍 搜尋附近店家</a>
                <a id="lnk-blog" class="res-btn-alt" target="_blank">📜 查看專業食記</a>
            </div>
        </div>
        <div class="btn-close" id="btn-close">[ 重新掃描 ]</div>
    </div>

<script>
    const foodData = [
        { cat: "台式在地", items: ["滷肉飯", "牛肉麵", "排骨飯", "控肉飯", "雞肉飯", "石頭火鍋", "薑母鴨", "羊肉爐", "白斬雞", "台式熱炒"] },
        { cat: "日式職人", items: ["豚骨拉麵", "握壽司", "豪華海鮮丼", "炸豬排定食", "讚岐烏龍麵", "日式咖哩", "天婦羅", "串燒居酒屋"] },
        { cat: "韓式潮流", items: ["韓式炸雞", "石鍋拌飯", "部隊鍋", "韓式烤肉", "辣炒年糕", "海鮮煎餅", "人蔘雞湯"] },
        { cat: "泰式風味", items: ["月亮蝦餅", "打拋豬", "檸檬魚", "酸辣蝦湯", "綠咖哩雞", "泰式炒河粉"] },
        { cat: "美義風味", items: ["雙層漢堡", "炭烤牛排", "義大利麵", "拿坡里披薩", "義式燉飯", "千層麵"] },
        { cat: "港式南洋", items: ["燒賣蝦餃", "干炒牛河", "海南雞飯", "越式河粉", "肉骨茶", "叻沙麵"] },
        { cat: "街頭小吃", items: ["蚵仔煎", "臭豆腐", "彰化肉圓", "割包", "大腸麵線", "地瓜球", "雞排"] },
        { cat: "深夜宵夜", items: ["鹹酥雞", "麻辣燙", "東山鴨頭", "永和豆漿", "滷味", "清粥小菜", "涼麵"] }
    ];

    const allItems = foodData.flatMap(d => d.items);
    const btnRun = document.getElementById('btn-run');
    const rollingText = document.getElementById('rolling-text');
    const viewManual = document.getElementById('view-manual');

    // 生成分類按鈕
    foodData.forEach(data => {
        const card = document.createElement('div');
        card.className = 'category-card';
        card.innerHTML = `<div class="cat-name">${data.cat}</div>`;
        card.onclick = () => {
            const randomItem = data.items[Math.floor(Math.random() * data.items.length)];
            showResult(data.cat, randomItem);
        };
        viewManual.appendChild(card);
    });

    // 名稱滾動隨機功能
    btnRun.onclick = () => {
        btnRun.disabled = true;
        let count = 0;
        const totalTicks = 20;
        
        const timer = setInterval(() => {
            rollingText.innerText = allItems[Math.floor(Math.random() * allItems.length)];
            count++;
            
            if(count > totalTicks) {
                clearInterval(timer);
                const finalCat = foodData[Math.floor(Math.random() * foodData.length)];
                const finalItem = finalCat.items[Math.floor(Math.random() * finalCat.items.length)];
                rollingText.innerText = finalItem;
                
                setTimeout(() => {
                    showResult(finalCat.cat, finalItem);
                    btnRun.disabled = false;
                }, 500);
            }
        }, 80);
    };

    function showResult(cat, name) {
        document.getElementById('overlay').style.display = 'flex';
        document.getElementById('res-tag').innerText = `[ ${cat} 偵測成功 ]`;
        document.getElementById('res-food').innerText = name;
        document.getElementById('lnk-map').href = `https://www.google.com/maps/search/${encodeURIComponent(name)}`;
        document.getElementById('lnk-blog').href = `https://www.google.com/search?q=${encodeURIComponent(name + " 推薦食記")}`;
    }

    document.getElementById('btn-close').onclick = () => {
        document.getElementById('overlay').style.display = 'none';
        rollingText.innerText = 'READY';
    };

    // 模式切換
    document.getElementById('nav-auto').onclick = function() {
        this.classList.add('active'); document.getElementById('nav-manual').classList.remove('active');
        document.getElementById('view-auto').style.display = 'flex'; viewManual.style.display = 'none'; btnRun.style.display = 'block';
    };
    document.getElementById('nav-manual').onclick = function() {
        this.classList.add('active'); document.getElementById('nav-auto').classList.remove('active');
        document.getElementById('view-auto').style.display = 'none'; viewManual.style.display = 'grid'; btnRun.style.display = 'none';
    };
</script>
</body>
</html>
